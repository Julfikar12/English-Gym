<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Gym by Julfikar</title>
<meta name="description" content="প্রতিদিন ১০ মিনিটে ইংরেজি — বাংলাদেশিদের কমন ভুল, শব্দ, গল্প আর ফ্রেজ। ফ্রি, লগইন ছাড়াই। by Julfikar">
<meta name="theme-color" content="#0B1730">
<meta property="og:title" content="English Gym by Julfikar — ফ্রি ইংলিশ প্র্যাকটিস">
<meta property="og:description" content="২০০+ কমন ভুলের কুইজ, ডেইলি ওয়ার্কআউট, স্ট্রিক আর ৩০ দিনের চ্যালেঞ্জ। একদম ফ্রি।">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first app shell — navy top bar, slate workspace, fixed bottom tab bar; desktop centers a 720px column */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#EEF1F6; --ink:#0F1A2E; --muted:#5A6478; --line:#DFE4EC;
  --accent:#0E8F62; --accent-ink:#FFFFFF; --accent-soft:#E2F5EC;
  --fire:#E8730C; --fire-soft:#FDEEDD; --gold:#A86A12; --gold-soft:#FDF3E1;
  --bad:#C0392B; --bad-soft:#FBE5E2; --good:#0E8F62; --good-soft:#E2F5EC;
  --nav:#0B1730; --nav-2:#13224A; --nav-ink:#EEF2FA; --nav-muted:#9AA8C4; --nav-line:rgba(255,255,255,.10);
  --f-display:'Plus Jakarta Sans','Hind Siliguri',system-ui,sans-serif;
  --f-body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(15,26,46,.05),0 8px 24px rgba(15,26,46,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A0F1A; --surface:#111827; --sunk:#0D1422; --ink:#E7ECF5; --muted:#94A0B8; --line:#243047;
  --accent:#34C88E; --accent-ink:#04231A; --accent-soft:#0F3026;
  --fire:#FF9A3D; --fire-soft:#3A2410; --gold:#E9B44C; --gold-soft:#33280F;
  --bad:#FF7A6B; --bad-soft:#3A1A17; --good:#34C88E; --good-soft:#0F3026;
  --nav:#060B16; --nav-2:#0F1A33; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
[hidden]{display:none!important}
.col{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:linear-gradient(180deg,var(--nav),var(--nav-2));color:var(--nav-ink);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:20}
.top .col{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;flex:none}
.logo b{display:block;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.15}
.logo small{display:block;font-size:12px;color:var(--nav-muted);line-height:1.2}
.streak-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--nav-line);border-radius:999px;padding:5px 12px 5px 9px;font-weight:700;font-variant-numeric:tabular-nums}
.streak-pill svg{width:18px;height:18px}

main{padding-block:18px 24px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.01em}
.h2{font-size:19px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:17px;padding:14px 18px;min-height:52px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600;color:var(--muted);min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* home */
.hero{background:linear-gradient(160deg,var(--nav),var(--nav-2));color:var(--nav-ink);border:1px solid var(--nav-line)}
.hero .muted{color:var(--nav-muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.07);border:1px solid var(--nav-line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--nav-muted)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lvl{display:flex;justify-content:space-between;font-size:13px;color:var(--nav-muted);margin-top:14px}
.lvl b{color:var(--nav-ink)}
.done-badge{display:inline-flex;align-items:center;gap:6px;background:var(--good-soft);color:var(--good);font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
.mistake .wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;font-weight:600}
.mistake .right{color:var(--good);font-weight:700;font-size:18px}
.mistake .mark-x,.mistake .mark-ok{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:800;margin-right:8px;vertical-align:2px}
.mark-x{background:var(--bad-soft);color:var(--bad)} .mark-ok{background:var(--good-soft);color:var(--good)}
.soon{border-style:dashed;box-shadow:none;background:transparent}
.soon li{margin-bottom:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 10px}

/* workout / quiz */
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;cursor:pointer;user-select:none}
.flash .w{font-family:var(--f-display);font-size:32px;font-weight:800}
.flash .pos{font-size:13px;color:var(--muted);font-style:italic}
.flash .bn{font-size:20px;font-weight:700;color:var(--accent)}
.flash .ex{color:var(--muted);max-width:42ch}
.q{font-size:15px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:17px;font-weight:500;line-height:1.45;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.explain{border-radius:12px;padding:12px 14px;font-size:15px}
.explain.good{background:var(--good-soft)} .explain.bad{background:var(--bad-soft)}
.explain b{display:block}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);min-height:96px;resize:vertical;font-size:16px}
.answer{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.answer .en{font-weight:700;font-size:17px}
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:6px auto;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.score-ring div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.score-ring b{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.center{text-align:center}

/* lists */
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);min-height:46px}
.mlist{display:flex;flex-direction:column;gap:10px}
.mitem{padding:14px 16px}
.mitem .cat{font-size:12px;color:var(--muted);font-weight:600}
.word-item{display:flex;justify-content:space-between;align-items:center;gap:12px}
.word-item b{font-family:var(--f-display);font-size:18px}
.story-text{font-size:17px;line-height:1.85}
.story-text button{border:0;background:var(--gold-soft);color:inherit;font-weight:700;border-radius:6px;padding:0 4px;border-bottom:2px solid var(--gold)}
.popover{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:15px}
.phrase .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.phrase .en{font-size:17px;font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* progress */
.grid30{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.grid30 span{aspect-ratio:1;border-radius:8px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid30 span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grid30 span.today{outline:2px solid var(--fire);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;background:var(--surface)}
.badge .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);flex:none}
.badge .ic svg{width:22px;height:22px}
.badge.got .ic{background:var(--gold-soft);color:var(--gold)}
.badge:not(.got){opacity:.55}
.badge b{display:block;font-size:14px;line-height:1.3}
.badge small{font-size:12px;color:var(--muted);line-height:1.3;display:block}

/* bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;min-height:60px;justify-content:center}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--accent)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(6,11,22,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.modal img{width:100%;border-radius:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center}
footer.credit{text-align:center;font-size:13px;color:var(--muted);padding-top:8px}
footer.credit b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="col">
  <a class="logo" href="#home" aria-label="English Gym হোম"><span class="mark">EG</span><span><b>English Gym</b><small>by Julfikar</small></span></a>
  <div class="streak-pill" id="streakPill" title="টানা দিনের স্ট্রিক">
    <svg viewBox="0 0 24 24" fill="#FF9A3D" aria-hidden="true"><path d="M12 2c1 3.5-1.5 5-1.5 7.5 0 1.2.8 2 1.8 2 1.5 0 2.2-1.4 1.7-3.5 2.6 1.6 4.5 4.3 4.5 7.3A6.5 6.5 0 0 1 12 22a6.5 6.5 0 0 1-6.5-6.7C5.5 10.4 10 7.8 12 2z"/></svg>
    <span id="streakNum">0</span>
  </div>
</div></header>

<main class="col" id="app" aria-live="polite"></main>

<nav class="tabbar" aria-label="মেনু"><div class="in">
  <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>হোম</a>
  <a href="#quiz" data-nav="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M8.5 11l2 2 3.5-3.5"/></svg>ভুল ধরো</a>
  <a href="#words" data-nav="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>শব্দ</a>
  <a href="#phrases" data-nav="phrases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>ফ্রেজ</a>
  <a href="#progress" data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>প্রোগ্রেস</a>
</div></nav>

<div id="modalHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
